<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" role="img" aria-label="How the bridge connects the controller to the daemon" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<rect width="760" height="212" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<text x="24" y="32" font-size="16" font-weight="600" fill="#1f2328">How the bridge connects the controller to the daemon</text>
<rect x="14" y="64" width="124" height="76" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/><text x="76.0" y="88.5" text-anchor="middle" fill="#1f2328" font-weight="600" font-size="13">Steam</text><text x="76.0" y="106.5" text-anchor="middle" fill="#1f2328" font-weight="600" font-size="13">controller</text><text x="76.0" y="124.5" text-anchor="middle" fill="#57606a" font-weight="400" font-size="11.5">in the steam room</text><line x1="140" y1="102.0" x2="164" y2="102.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="152.0" y="162" text-anchor="middle" font-size="11.5" fill="#57606a">4-wire cable</text><rect x="166" y="64" width="124" height="76" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/><text x="228.0" y="88.5" text-anchor="middle" fill="#1f2328" font-weight="600" font-size="13">USB-A</text><text x="228.0" y="106.5" text-anchor="middle" fill="#1f2328" font-weight="600" font-size="13">breakout</text><text x="228.0" y="124.5" text-anchor="middle" fill="#57606a" font-weight="400" font-size="11.5">cable plugs in here</text><line x1="292" y1="102.0" x2="316" y2="102.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="304.0" y="162" text-anchor="middle" font-size="11.5" fill="#57606a">3 wires</text><rect x="318" y="64" width="124" height="76" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/><text x="380.0" y="88.5" text-anchor="middle" fill="#1f2328" font-weight="600" font-size="13">DB9 breakout</text><text x="380.0" y="106.5" text-anchor="middle" fill="#1f2328" font-weight="600" font-size="13">+ MAX3232</text><text x="380.0" y="124.5" text-anchor="middle" fill="#57606a" font-weight="400" font-size="11.5">converter module</text><line x1="444" y1="102.0" x2="468" y2="102.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="456.0" y="162" text-anchor="middle" font-size="11.5" fill="#57606a">4 jumper wires</text><rect x="470" y="64" width="124" height="76" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="532.0" y="88.5" text-anchor="middle" fill="#1f2328" font-weight="600" font-size="13">ESP32</text><text x="532.0" y="106.5" text-anchor="middle" fill="#57606a" font-weight="400" font-size="11.5">runs the bridge</text><text x="532.0" y="124.5" text-anchor="middle" fill="#57606a" font-weight="400" font-size="11.5">firmware</text><line x1="596" y1="102.0" x2="620" y2="102.0" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="608.0" y="162" text-anchor="middle" font-size="11.5" fill="#57606a">WiFi</text><rect x="622" y="64" width="124" height="76" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/><text x="684.0" y="88.5" text-anchor="middle" fill="#1f2328" font-weight="600" font-size="13">Daemon</text><text x="684.0" y="106.5" text-anchor="middle" fill="#57606a" font-weight="400" font-size="11.5">on the</text><text x="684.0" y="124.5" text-anchor="middle" fill="#57606a" font-weight="400" font-size="11.5">Raspberry Pi</text><text x="24" y="192" font-size="11.5" fill="#57606a">The cable has a USB-shaped plug but carries serial signals, not USB. It only ever goes into the USB-A breakout.</text></svg>
