ght="30" fill="#ffffff" stroke="#8c959f"/><text x="242" y="264.5" text-anchor="middle" font-weight="600" fill="#1f2328">GROUND</text><text x="56" y="264.5" font-size="11.5" fill="#57606a">reads 0V</text><rect x="500" y="245" width="96" height="30" fill="#ffffff" stroke="#8c959f"/><text x="548" y="264.5" text-anchor="middle" font-weight="600" fill="#1f2328">terminal 5</text><text x="608" y="264.5" font-size="11.5" fill="#57606a">ground</text><line x1="290" y1="260" x2="500" y2="260" stroke="#1f2328" stroke-width="3"/><rect x="194" y="291" width="96" height="30" fill="#ffffff" stroke="#8c959f"/><text x="242" y="310.5" text-anchor="middle" font-weight="600" fill="#1f2328">SHELL</text><text x="56" y="310.5" font-size="11.5" fill="#57606a">metal case of the plug</text><text x="306" y="310.5" font-size="11.5" fill="#57606a">always empty</text><text x="24" y="358" font-size="11.5" fill="#57606a">The names on the left are found by measuring (Step 4), not by counting terminals or reading the printed labels.</text></svg>
